<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="24" cy="24" r="22" fill="url(#glow)"/>
  
  <!-- Lotus petals / Eye shapes (left and right) -->
  <ellipse cx="12" cy="24" rx="6" ry="10" fill="#4F46E5" opacity="0.4" stroke="#818CF8" stroke-width="0.5"/>
  <ellipse cx="36" cy="24" rx="6" ry="10" fill="#4F46E5" opacity="0.4" stroke="#818CF8" stroke-width="0.5"/>
  
  <!-- Concentric circles -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.6"/>
  <circle cx="24" cy="24" r="10" fill="#4F46E5" opacity="0.3" stroke="#818CF8" stroke-width="0.8"/>
  
  <!-- Inner circle around triangle -->
  <circle cx="24" cy="24" r="7" fill="none" stroke="#A5B4FC" stroke-width="1"/>
  
  <!-- Downward-pointing triangle -->
  <path d="M 24 14 L 18 22 L 30 22 Z" fill="#6366F1" stroke="#E0E7FF" stroke-width="1.5"/>
  
  <!-- Om symbol inside triangle -->
  <g transform="translate(24, 18)">
    <!-- Om "3" shape -->
    <path d="M -3 0 Q -1 -2 1 0 Q -1 2 -3 0" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Curved line from top right -->
    <path d="M 1 0 Q 2 -1 2.5 -0.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Dot above -->
    <circle cx="2.5" cy="-1.5" r="0.8" fill="#FFFFFF"/>
  </g>
  
  <!-- Radiating light rays (top) -->
  <line x1="24" y1="2" x2="24" y2="6" stroke="#E0E7FF" stroke-width="1" opacity="0.8"/>
  <line x1="20" y1="3" x2="21" y2="6" stroke="#E0E7FF" stroke-width="0.8" opacity="0.7"/>
  <line x1="28" y1="3" x2="27" y2="6" stroke="#E0E7FF" stroke-width="0.8" opacity="0.7"/>
  <line x1="16" y1="5" x2="17.5" y2="7.5" stroke="#E0E7FF" stroke-width="0.8" opacity="0.6"/>
  <line x1="32" y1="5" x2="30.5" y2="7.5" stroke="#E0E7FF" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Radiating light rays (bottom) -->
  <line x1="24" y1="42" x2="24" y2="46" stroke="#E0E7FF" stroke-width="1" opacity="0.8"/>
  <line x1="20" y1="45" x2="21" y2="42" stroke="#E0E7FF" stroke-width="0.8" opacity="0.7"/>
  <line x1="28" y1="45" x2="27" y2="42" stroke="#E0E7FF" stroke-width="0.8" opacity="0.7"/>
</svg>